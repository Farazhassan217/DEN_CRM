services:
  gateway:
    image: nginx:alpine
    container_name: dental_crm_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - dental_network

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: dental_crm_backend
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - backend/.env
    depends_on:
      - redis
    networks:
      - dental_network

  redis:
    image: redis:7-alpine
    container_name: dental_crm_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - dental_network

networks:
  dental_network:
    driver: bridge

volumes:
  redis_data:
